# Publica o site no GitHub Pages a cada push na main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# O Pages precisa destas permissões para receber o artefato e publicá-lo.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo não cancela o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # O site vive em jadisonribeiro.github.io/Rabisco, não na raiz do
      # dominio: VITE_BASE reescreve os caminhos dos assets e VITE_SITE_URL
      # alimenta canonical, Open Graph, JSON-LD, robots.txt e sitemap.xml.
      - run: npm run build
        env:
          VITE_BASE: /Rabisco/
          VITE_SITE_URL: https://jadisonribeiro.github.io/Rabisco

      # enablement liga o Pages pela API na primeira execucao; sem isto o
      # deploy falha ate alguem trocar o Source a mao em Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
